# =========================================================================================================
#                               【Important】
#  DO NOT EDIT config.tmpl.yml !!!
#  Copy and rename this file to config.yml as your configuration file.
#  Any changes to this file will be reverted.
#  -------------------------------------------------------------------------------------------------------
#                               【非常重要】
#  不要修改 config.tmpl.yml !!!
#  复制此文件并重命名为 config.yml 来作为你的配置文件
#  此文件的任何修改将会在服务器启动时被还原
# =========================================================================================================

# DO NOT EDIT
# 不要修改
version: 31


# ============================================================
# 语言 / Language
# ============================================================
# 可选项: en, zh, zh_cn, zh_tw, zh_hk
i18n:
  locale: zh


# ============================================================
# 数量限制 / Limits
# ============================================================

# 服务器同时存在的假人上限
# Maximum fake players on the whole server
server-limit: 1000

# 每个玩家可召唤的假人上限
# Maximum fake players each player can spawn
player-limit: 1

# 同一 IP 共享 player-limit (防止开小号刷假人)
# Players sharing an IP share the player-limit
detect-ip: true


# ============================================================
# 名称 / Naming
# ============================================================

# 默认名称模版, 留空表示使用创建者名称加后缀
# %c: 创建者名称
# 注意: 只应包含英文字母/数字/下划线 (否则许多原版与第三方命令会失效), 长度不超过 16, 且不能以 - 开头
# Name template, empty means the creator's name plus a suffix
# %c: the name of the creator
# Note: only letters/numbers/underscores (otherwise many commands will not work on them), max 16 chars, cannot start with '-'
name-template: ''

# 名称前缀, 自动生成的名称与自定义名称都会加上
# Name prefix, added to generated and custom names
name-prefix: ''

# 自定义名称允许的字符 (正则表达式, 必须以 ^ 开头、以 $ 结尾)
# 自定义名称需要玩家拥有 `fakeplayer.spawn.name` 权限
# Allowed characters of a custom name (regex, must start with ^ and end with $)
# A custom name requires the `fakeplayer.spawn.name` permission
name-pattern: '^[a-zA-Z0-9_]+$'

# Tab 列表中的名称样式
# 可选项: black, dark_blue, dark_green, dark_aqua, dark_red, dark_purple, gold, gray,
#         dark_gray, blue, green, aqua, red, light_purple, yellow, white,
#         obfuscated, bold, strikethrough, underlined, italic
# Name style on the tab list
name-style: gray, italic


# ============================================================
# 存活与存档 / Lifespan & persistence
# ============================================================

# 假人存活时间, 0 表示永久
# 单位: 分钟
# Fake player lifespan, 0 means permanent
# Unit: minute
lifespan: 0

# 是否保存假人存档 (背包、位置等)
# 设为 false 时建议把「移除与死亡」中的 drop-inventory-on-quiting 也设为 true
# Whether to persist fake player data
# When false, consider enabling drop-inventory-on-quiting (see "Removal & death")
persistent-data: true

# 记录在线假人, 并在下次服务器启动时自动恢复 (含原位置与创建者)
# Record online fake players and restore them (with position and creator) on the next server start
restore-on-start: false


# ============================================================
# 跟随下线 / Follow quitting
# ============================================================

# 创建者下线时假人跟随下线
# 玩家只是切换服务器时不会触发
# Remove fake players when their creator quits
# Merely switching servers does not trigger this
follow-quiting: true

# 创建者退出时立即清理其假人 (默认的跟随下线依赖定时轮询)
# 注意: 开启后会绕过「仅切换服务器不触发跟随下线」的判断
# Remove them right after the creator quits, instead of waiting for the periodic poll
# NOTE: this bypasses the "server switching" guard above
follow-quiting-force: false

# 立即清理前的延迟 (秒)
# 创建者在这段时间内重新上线 (快速重连) 则不会清理其假人
# Delay in seconds before the immediate cleanup
# If the creator is back online within this delay, their fake players are kept
follow-quiting-force-delay: 3


# ============================================================
# 移除与死亡 / Removal & death
# ============================================================

# 假人被移除时是否丢弃背包物品
# Drop inventory items when a fake player is removed
drop-inventory-on-quiting: false

# 死亡时是否踢出, 设为 false 时玩家可以通过 /fp respawn 重生
# Kick the fake player on death; when false it can be respawned with /fp respawn
kick-on-dead: true

# 假人死亡时是否广播死亡消息 (仅在 kick-on-dead: true 时生效)
# Broadcast the fake player's death message (only applies when kick-on-dead is true)
death-message: false


# ============================================================
# 兼容性 / Compatibility
# ============================================================

# 防止假人被其他插件或 /kick 踢出
# 可选项:
#   NEVER: 不处理
#   ON_SPAWNING: 仅在创建时防止被踢出
#   ALWAYS: 始终防止 (某些登录插件会在下 1 tick 踢人, 这种情况请用 ALWAYS)
# Prevent fake players from being kicked by other plugins or /kick
# Options: NEVER / ON_SPAWNING / ALWAYS
prevent-kicking: ON_SPAWNING

# 在不支持的版本强制运行 (忽略 NMSBridge 版本检查, 可能因 NMS 不兼容而崩溃)
# Force running on unsupported Minecraft versions by ignoring the NMSBridge version check
forced-execution: false


# ============================================================
# 共享假人 / Share fake players
# ============================================================

# 是否允许不同玩家共享同一个假人 (同一名称始终使用相同 UUID)
# 关闭: 每次召唤同一名称的假人可能使用不同 UUID (usercache 会累积多个记录)
# 开启: 同一名称始终使用相同 UUID, 不同玩家可以轮流控制同一个假人
# Allow different players to share the same fake player (same name = same UUID)
# OFF: each spawn of the same name may get a different UUID (usercache accumulates entries)
# ON: the same name always gets the same UUID, different players can share the same fake player
share-fakeplayer: false

# ============================================================
# 性能保护 / TPS protection
# ============================================================

# 服务器最近 5 分钟平均 TPS 低于此值时清除所有假人, 0 表示关闭
# 不推荐开启, 移除假人可能导致玩家的红石机器出问题
# Remove all fake players when the 5-minute average TPS drops below this value, 0 disables it
# Not recommended: removing fake players may break redstone machines
kale-tps: 0


# ============================================================
# 命令钩子 / Command hooks
# ============================================================
# 占位符: %p 假人名称, %u 假人 UUID, %c 创建者名称
# Variables: %p fake player name, %u fake player UUID, %c creator name

# 创建假人之前执行 (可用于加白名单等)
# Commands executed BEFORE trying to spawn a fake player
pre-spawn-commands:
  - ''
  - ''

# 假人正在加入游戏时执行 (PlayerJoinEvent 内)
# Commands executed DURING spawning (in PlayerJoinEvent)
post-spawn-commands:
  - ''
  - ''

# 假人创建完成后执行 (可用于分配权限组)
# Commands executed AFTER the fake player was spawned
after-spawn-commands:
  - ''
  - ''

# 由假人自己执行, 可用于登录插件
# 请确保密码足够复杂, 否则登录插件可能拒绝
# Executed by the fake player itself, useful for login commands
self-commands:
  - ''
  - ''

# 假人正在退出时执行, 此时假人仍在服务器上
# Commands executed when the fake player is quitting (still online)
post-quit-commands:
  - ''
  - ''

# 假人退出游戏后执行 (可用于清理数据)
# Commands executed AFTER the fake player has quit
after-quit-commands:
  - ''
  - ''


# ============================================================
# 默认特性 / Default features
# ============================================================

# 玩家未通过 /fp config 修改过配置或没有权限时生效
# Applied when the player never changed them via /fp config or has no permission
default-features:
  collidable: true
  pickup_items: true
  skin: true
  look_at_entity: false
  invulnerable: true
  replenish: false
  replace_tools: false
  autofish: false
  wolverine: false
  # 假人的模拟距离 (以假人为中心的区块半径), -1 表示沿用世界设置
  # Simulation distance around the fake player in chunks; -1 keeps the world setting
  simulation_distance: -1


# ============================================================
# 自动补货与工具替换 / Replenish & tool replacement
# ============================================================

# 自动补货时工具的自动修复阈值
# 取值 0-100, 表示工具磨损达到该百分比时修复; 0 表示不自动修复
# Durability percentage at which replenish repairs tools; 0 disables auto repair
replenish:
  tools:
    durability-threshold: 0

# 工具替换: 非经验修补工具损坏后更换; 经验修补工具在剩余耐久低于该值时更换
# 该特性通过 `/fp config set replace_tools true` 按假人开启
# Non-Mending tools are replaced after breaking; Mending tools are replaced at this remaining durability
# Enabled per fake player with `/fp config set replace_tools true`
tool-replacement:
  remaining-durability-threshold: 10


# ============================================================
# 背包查看 / Inventory viewing
# ============================================================

# Invsee 实现:
#   AUTO: 自动选择 (目前支持 OpenInv)
#   SIMPLE: 内置实现, 无法查看或编辑装备栏
# Invsee implementation: AUTO (auto-detect, currently OpenInv) or SIMPLE (cannot view or edit equipment)
invsee-implement: AUTO

# 允许非 OP 玩家打开假人背包
# Allow non-OP players to open fake player inventories
allow-non-op-open-inv: false


# ============================================================
# 延迟显示 / Ping display
# ============================================================

# 假人在 Tab 列表里显示的延迟 (ping)
# 单个值表示固定延迟; 用 "20,50" 表示在 20~50 ms 之间随机; 留空或负数表示不模拟, 使用真实值
# Fake player ping shown on the tab list
# A single value is fixed; "20,50" picks a random value in that range; empty or negative disables it
custom-ping: ''

# 是否让延迟在设定值上下小幅波动 (±8ms, 看起来更自然)
# Whether to let the ping drift slightly around the configured value (±8ms)
custom-ping-dynamic: false

# 延迟波动的更新间隔 (tick)
# Interval in ticks between dynamic ping updates
custom-ping-dynamic-interval: 200


# ============================================================
# 自动登录 / Auto login
# ============================================================
#
# 假人登录有两套互不影响的机制:
#
#   1. 登录插件 API 免登录 —— 无需任何配置 (推荐)
#      服务端装有 AuthMe / CatSeedLogin / LibreLogin / LibreLoginNext 时自动生效:
#      插件直接调用其 API 把假人标记为已登录, 不需要密码, 也不执行任何命令。
#
#   2. 命令模板登录 —— 由下方 `command.enabled` 控制
#      假人生成后由自身执行注册 / 登录命令, 密码保存在插件数据库中。
#      适用于没有 API 兼容的登录插件。
#
# 两者可以同时存在; 若登录插件已被第 1 种方式放行, 通常不需要再开启第 2 种。
#
# There are two independent login mechanisms for fake players:
#
#   1. Login-plugin API exemption — no configuration needed (recommended)
#      Applied automatically when AuthMe / CatSeedLogin / LibreLogin /
#      LibreLoginNext is installed: the fake player is marked as logged in
#      through the plugin's own API, with no password and no commands.
#
#   2. Command-template login — controlled by `command.enabled` below
#      The fake player runs register / login commands, with the password
#      stored in the plugin database. Use it when no API compatibility exists.
#
# Both may be active; if mechanism 1 already passes the fake player through,
# mechanism 2 is usually unnecessary.
auto-login:

  # 命令模板登录 / Command-template login
  command:

    # 总开关: 假人生成后是否执行下方 register / login 命令
    # Master switch: run the register / login commands after spawning
    enabled: false

    # 注册命令模板, %password% 会替换为数据库中的密码
    # Register command template; %password% is replaced with the stored password
    register: "/reg %password% %password%"

    # 登录命令模板, %password% 会替换为数据库中的密码
    # Login command template; %password% is replaced with the stored password
    login: "/login %password%"

    # 修改密码命令模板 (供 /fp changepassword 使用), %oldpassword% / %newpassword% 会被替换
    # 默认为 AuthMe 风格; 若你的登录插件使用 /changepw 请按需修改
    # Change password command template; %oldpassword% and %newpassword% are replaced
    change-password: "/changepassword %oldpassword% %newpassword% %newpassword%"

  # 随机密码 / Random password (仅命令模板登录使用)
  # Used by command-template login only
  random-password:

    # 随机密码字符集; 留空表示不自动生成 (此时必须先用 /fp password 手动设置密码)
    # Charset for generated passwords; leave empty to disable generation
    charset: ""

    # 随机密码长度
    # Generated password length
    length: 12


# ============================================================
# 更新检查 / Update check
# ============================================================

# 与本仓库 GitHub Releases 的最新 `fp.buildN` 比较
# 仅仅是检测, 不会自动下载
# Check for updates against the latest `fp.buildN` GitHub release of this repository
# Detection only, nothing is downloaded automatically
check-for-updates: true


# ============================================================
# HTTP 远程管理接口 / HTTP admin interface
# ============================================================
# 启用后可通过 GET / POST 远程查询与操作假人, 接口清单见 README
# 所有接口都会产生副作用, 请勿把接口地址暴露给不可信来源
# Endpoints are documented in the README. Every endpoint has side effects,
# never expose this service to untrusted networks.
http-admin:
  # 是否启用 HTTP 接口
  # Enable the HTTP admin interface
  enabled: false
  # 监听地址, 0.0.0.0 表示监听所有网卡
  # Listen address, 0.0.0.0 listens on all interfaces
  host: 0.0.0.0
  # 监听端口
  # Listen port
  port: 3253
  # 鉴权令牌, 为空时启动时随机生成并在控制台打印
  # 建议使用足够长的随机字符串
  # Auth token; if empty, a random token is generated at startup and printed to console
  token: ""
  # 是否允许 GET 请求; 关闭后仅接受 POST
  # 令牌始终通过 Authorization 请求头传递, 参数仍走 query
  # Allow GET requests; when disabled only POST is accepted
  # The token always travels in the Authorization header, parameters stay in the query string
  allow-get: true
  # Host / Origin 白名单, 留空表示不校验
  # 可缓解 DNS rebinding (恶意网页把域名解析到本机再借浏览器访问本接口)
  # Host / Origin allowlist, empty means no check; mitigates DNS rebinding
  allowed-hosts: []

  # 限流与失败锁定 / Rate limiting and lockout
  rate-limit:
    # 每个来源 IP 每分钟允许的请求数
    # Requests allowed per source IP per minute
    requests-per-minute: 120
    # 连续鉴权失败多少次后锁定来源 IP, 0 表示不锁定
    # Lock the source IP after this many consecutive auth failures; 0 disables the lockout
    auth-failures: 10
    # 锁定时长 (秒)
    # Lockout duration in seconds
    lockout-seconds: 60

  # 各接口开关 / Per-endpoint switches
  interface:
    # 查询类 / Query
    list: true          # GET /list         列出在线假人          list online fake players
    status: true        # GET /status       假人详细状态          detailed state (location/health/inventory/actions)
    info: true          # GET /info         插件与服务端信息      plugin and server info
    # 生命周期 / Lifecycle
    spawn: true         # GET /spawn        生成假人              spawn a fake player
    kick: true          # GET /kick         移除假人              remove a fake player
    kill: true          # GET /kill         杀死假人              kill a fake player
    respawn: true       # GET /respawn      重生已死亡的假人      respawn a dead fake player
    # 行为控制 / Behaviour
    action: true        # GET /action       触发动作 (attack/mine/use/jump/drop/say 等)
    stop: true          # GET /stop         停止当前所有动作      stop all running actions
    say: true           # GET /say          让假人发言            make a fake player send a chat message
    aichat: true        # GET /aichat       让假人用 AI 发言      let a fake player talk via AI
    teleport: true      # GET /teleport     传送假人              teleport a fake player
    look: true          # GET /look         设置朝向              set the look direction
    hold: true          # GET /hold         切换主手槽位          switch the main hand slot
    swap: true          # GET /swap         交换主副手物品        swap main and off hand
    goto: true          # GET /goto         寻路前往坐标          walk to coordinates (rejects unreachable targets)
    setping: true       # GET /setping      设置 Tab 列表延迟     set the tab list ping
    sneak: true         # GET /sneak        切换潜行              toggle / set sneaking
    sprint: true        # GET /sprint       切换疾跑              toggle / set sprinting
    # 其他 / Others
    cmd: true           # GET /cmd          以假人身份执行命令    run a command as the fake player
    reload: true        # GET /reload       重载配置与语言        reload config and translations
    batch: true         # GET /kickall /killall /sayall            批量操作 batch operations