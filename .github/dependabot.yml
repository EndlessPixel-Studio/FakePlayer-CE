version: 2
updates:
  # Gradle 依赖（含各 version 适配模块的 build.gradle.kts）
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "master"
    labels:
      - "dependency | 依赖"
    commit-message:
      prefix: "build"
      include: "scope"

  # GitHub Actions 工作流使用的 action 版本
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "master"
    labels:
      - "dependency | 依赖"
    commit-message:
      prefix: "ci"
      include: "scope"
