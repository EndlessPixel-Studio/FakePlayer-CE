version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "master"
    labels:
      - "dependency"
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      - dependency-name: "io.papermc.paper:paper-api"
      - dependency-name: "io.papermc.paperweight.userdev"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "master"
    labels:
      - "dependency"
    commit-message:
      prefix: "ci"
      include: "scope"