name: 功能建议（中文）
description: 提交新功能或优化建议
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 我已检索现有 Issues 和 PR，确认该功能建议没有重复提交
          required: true
        - label: 我已经思考过替代方案，认为该功能对大部分用户有用
          required: true
        - label: 我已完成所有检查项（老实说我没仔细看）
          required: false
  - type: textarea
    id: feature_desc
    attributes:
      label: 功能描述
      description: 描述你想要的功能
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: 使用场景 / 需要解决的问题
      description: 这个功能用来解决什么痛点
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: 建议实现方案
      description: 你设想的实现方式
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 试过哪些临时方案、其他思路
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 链接、截图、参考资料等（选填）
