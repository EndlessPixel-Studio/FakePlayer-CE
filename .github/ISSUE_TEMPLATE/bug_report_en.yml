name: Bug Report (English)
description: Report bugs for fp.buildx
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and pull requests to confirm that this bug has not been previously reported or resolved.
          required: true
        - label: I have verified that my runtime environment meets all plugin requirements.
          required: true
        - label: I have completed all checklist items (admittedly without reading them closely)
          required: false
        - label: I have attached the error log to facilitate troubleshooting (if available).
          required: true
  - type: input
    id: plugin_version
    attributes:
      label: Plugin Version
      description: fp.buildx version. Do NOT fill in "Latest". Specify the exact version number.
      placeholder: e.g. fp.build21
    validations:
      required: true
  - type: input
    id: mc_version
    attributes:
      label: MC Server Version
      placeholder: e.g. 1.21.8 / 26.3
    validations:
      required: true
  - type: input
    id: server_core
    attributes:
      label: Server Core
      placeholder: e.g. Paper / Purpur / Folia
    validations:
      required: true
  - type: textarea
    id: bug_desc
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How to trigger this bug
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste error logs here (leave blank if no logs are available)
      render: shell
