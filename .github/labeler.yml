# PR 自动贴标规则 (规范见 LABELS.md)
# 可从文件路径推导的功能域自动贴; 推不出不的域 (action/command/spawn/login/appearance/compat) 由人工补

"documentation":
  - changed-files:
      - any-glob-to-any-file: ['**/*.md']

"core":
  - changed-files:
      - any-glob-to-any-file: ['fakeplayer-core/**']

"api":
  - changed-files:
      - any-glob-to-any-file: ['fakeplayer-api/**']

"nms":
  - changed-files:
      - any-glob-to-any-file: ['versions/**']

"dist":
  - changed-files:
      - any-glob-to-any-file: ['fakeplayer-dist/**']

"dependency":
  - changed-files:
      - any-glob-to-any-file: ['.github/**']

"locale":
  - changed-files:
      - any-glob-to-any-file: ['fakeplayer-core/src/main/resources/message/**']

"config":
  - changed-files:
      - any-glob-to-any-file: ['fakeplayer-core/src/main/resources/config.yml']

"http-api":
  - changed-files:
      - any-glob-to-any-file: ['fakeplayer-core/src/main/java/**/http/**']

"placeholder":
  - changed-files:
      - any-glob-to-any-file: ['fakeplayer-core/src/main/java/**/placeholder/**']
