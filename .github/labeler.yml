"documentation":
  - changed-files:
      - any-glob-to-any-file: ['**/*.md']

"core":
  - changed-files:
      - any-glob-to-any-file: ['fakeplayer-core/**']

"api":
  - changed-files:
      - any-glob-to-any-file: ['fakeplayer-api/**']

"nms":
  - changed-files:
      - any-glob-to-any-file: ['versions/**']

"dist":
  - changed-files:
      - any-glob-to-any-file: ['fakeplayer-dist/**']

# 仓库配置 / 工作流变更归入 dependency (版本与工程依赖面)
"dependency":
  - changed-files:
      - any-glob-to-any-file: ['.github/**']

# 功能域: 消息文案与配置项的变更都面向最终用户行为
"feature":
  - changed-files:
      - any-glob-to-any-file:
          - 'fakeplayer-core/src/main/resources/message/**'
          - 'fakeplayer-core/src/main/resources/config.yml'
