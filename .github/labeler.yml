# PR 自动贴标规则 (规范见 LABELS.md)
# 注意: feature 是 issue 侧的功能域标签, PR 不贴; 消息文案与配置项在 fakeplayer-core 下, 自动归入 core
"documentation":
  - changed-files:
      - any-glob-to-any-file: ['**/*.md']

"core":
  - changed-files:
      - any-glob-to-any-file: ['fakeplayer-core/**']

"api":
  - changed-files:
      - any-glob-to-any-file: ['fakeplayer-api/**']

"nms":
  - changed-files:
      - any-glob-to-any-file: ['versions/**']

"dist":
  - changed-files:
      - any-glob-to-any-file: ['fakeplayer-dist/**']

# 仓库配置 / 工作流变更归入 dependency (版本与工程依赖面)
"dependency":
  - changed-files:
      - any-glob-to-any-file: ['.github/**']
