name: Sync README to Hangar

on:
  push:
    branches: [master]
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hangar-page
  cancel-in-progress: true

jobs:
  sync:
    name: Sync README.md to Hangar page
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Sync page content
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          python3 -m py_compile .github/scripts/sync_hangar.py
          python3 .github/scripts/sync_hangar.py page
