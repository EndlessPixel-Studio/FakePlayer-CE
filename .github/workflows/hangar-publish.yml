name: Publish to Hangar
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 fp.build16'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hangar-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Create Hangar version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # 默认分支 + 完整历史：脚本本身要取默认分支的版本，
          # 而支持版本是去 tag 上读的（release 事件默认检出的是 tag，那里没有脚本）。
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Create Hangar version
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 -m py_compile .github/scripts/sync_hangar.py
          python3 .github/scripts/sync_hangar.py version --tag "$TAG"
