name: Sync README to Modrinth

# 监听 README.md 变更：一旦 master 上的 README.md 更新，就把内容同步到 Modrinth 项目简介（body）。
# 相对链接（README_zh.md / README_zh_TW.md / BUILD.md / LICENSE.txt / fakeplayer-core/...、以及 HTML 里的
# <img src>/<a href>）会改写为 https://github.com/<repo>/blob/<ref>/... 绝对 URL，确保在 Modrinth 页面上可正常跳转。
on:
  push:
    branches: [master]
    paths:
      - 'README.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印重写结果，不发送 PATCH'
        type: boolean
        default: false

# CI 只调用 Modrinth API（token 走 secret），不需要写仓库
permissions:
  contents: read

concurrency:
  group: sync-modrinth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync README.md to Modrinth project body
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rewrite links and PATCH Modrinth body
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          python3 -m py_compile .github/scripts/sync_modrinth.py
          python3 .github/scripts/sync_modrinth.py
