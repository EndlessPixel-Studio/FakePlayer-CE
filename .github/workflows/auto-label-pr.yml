name: Auto Label PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # 1. 先清理受管标签，避免旧分类残留
      # 这里列出的标签都必须能被 labeler.yml 重新推导出来, 否则会被净删 (dependency 即如此)
      - uses: actions-ecosystem/action-remove-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: |
            documentation
            core
            api
            nms
            dist
            dependency

      # 2. 再按 .github/labeler.yml 重新计算
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
