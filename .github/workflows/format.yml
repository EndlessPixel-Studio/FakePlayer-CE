name: Format

# 每次 push (任意分支) 与 PR 都校验 google-java-format,
# 不受 ci.yml 的 paths-ignore / 分支限制
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spotless:
    name: spotlessCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Check formatting
        run: ./gradlew spotlessCheck --build-cache --parallel --console=plain
