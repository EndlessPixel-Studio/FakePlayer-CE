name: Sync README to NexusMC

on:
  push:
    branches: [master]
    paths:
      - 'README_zh.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印转换结果，不发送 PATCH'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-nexusmc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync README_zh.md to NexusMC content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Convert README and PATCH NexusMC content
        env:
          NEXUSMC_TOKEN: ${{ secrets.NEXUSMC_TOKEN }}
          NEXUSMC_RESOURCE_ID: ${{ vars.NEXUSMC_RESOURCE_ID }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          python3 -m py_compile .github/scripts/sync_nexusmc.py
          python3 .github/scripts/sync_nexusmc.py
