name: Deploy docs

on:
  push:
    branches: [master]
    paths:
      - 'vitepress_docs/**'
      - 'vitepress_docs/package.json'
      - 'vitepress_docs/package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          enablement: true
          static_site_generator: vitepress
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vitepress_docs/package-lock.json
      - name: Install dependencies
        working-directory: vitepress_docs
        run: npm ci
      - name: Build site
        working-directory: vitepress_docs
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: vitepress_docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
