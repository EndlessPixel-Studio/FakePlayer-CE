name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
          cache-write-only: ${{ github.event_name == 'push' }}

      - name: Build with Gradle
        run: ./gradlew :fakeplayer-dist:shadowJar --build-cache --console=plain

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fakeplayer-ce
          path: fakeplayer-dist/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
