name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check command args
        run: python3 .github/scripts/check_command_args.py

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cache-hit: ${{ steps.gradle-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7

      # 不再给 setup-java 传 cache: 'gradle' —— 它和下面的 setup-gradle 会把
      # 同一个 ~/.gradle 存两遍, 白付一次 restore/save 的时间。
      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Paperweight
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/paperweight
            **/build/paperweight
          key: ${{ runner.os }}-paperweight-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-paperweight-

      # 格式由 format.yml 负责 (任意分支 push + PR 都会跑), 这里只构建,
      # 不再重复执行 spotlessCheck。
      - name: Setup Gradle
        id: gradle-cache
        uses: gradle/actions/setup-gradle@v6
        with:
          # 默认行为: 默认分支 push 才写缓存, PR 只读 (等于省掉一次 post save)
          gradle-home-cache-includes: |
            caches
            wrapper
            notifications
          # paperweight 的 Minecraft jar 已经有独立的 cache 步骤, 不再跟着
          # Gradle Home 一起存一遍 (否则每次 push 要多传几百 MB)。
          gradle-home-cache-excludes: |
            caches/paperweight

      - name: Build
        run: ./gradlew :fakeplayer-dist:shadowJar --build-cache --parallel --console=plain -Dorg.gradle.workers.max=4

      - name: Upload artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: fakeplayer-ce
          path: fakeplayer-dist/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
          # 产物本身就是 jar, 再压一遍只是白烧 CPU
          compression-level: 0
