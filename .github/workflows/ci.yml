name: CI
on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check command arguments
        run: python3 .github/scripts/check_command_args.py
      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
          cache-write-only: ${{ github.event_name == 'push' }}
      - name: Build with Gradle
        run: ./gradlew spotlessCheck :fakeplayer-dist:shadowJar --build-cache --parallel --console=plain
      - name: Upload artifacts
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: fakeplayer-ce
          path: fakeplayer-dist/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
